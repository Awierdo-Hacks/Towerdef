# =============================================================================
# Tower Defence — Main Game Configuration
# =============================================================================
# Loaded by ConfigManager at startup. All values have sensible defaults.

# --- Window ---
# Houd de venster-verhouding gelijk aan game.width:game.height (4:3) zodat tiles
# vierkant blijven. Groter venster = grotere tiles/sprites, zelfde aantal tegels.
# 960x720 → 48 px per tile (was 800x600 → 40 px/tile).
window.width=960
window.height=720
window.title=Tower Defence

# --- Game world (in game-world units, NOT pixels) ---
# Bepaalt het AANTAL tegels (20x15). Niet wijzigen om de upscaling te behouden:
# enkel het venster hierboven schaalt de weergave, niet het aantal tegels.
game.width=20.0
game.height=15.0

# --- Starting resources ---
starting.gold=200
starting.lives=2

# --- Level selection (1 or 2) ---
selected.level=1

# --- Lua AI script (pad relatief aan classpath-root) ---
# Dit script wordt elke frame aangeroepen voor elke vijand.
# Zet op een lege string of verwijder de key om Lua uit te schakelen.
lua.script=scripts/enemy_ai.lua
